; Raises the PHP-FPM per-directory limits for this app's front controller
; (public/index.php handles every request, so these apply site-wide).
; upload_max_filesize/post_max_size are PHP_INI_PERDIR, so .user.ini can
; set them without touching the server's global php.ini.
;
; Page Content image uploads (Ec\PageContentController) cap at 5 MB per
; file, and the "Training Category Images" page can submit several file
; inputs in one POST — post_max_size must clear the combined total, not
; just one file, hence the extra headroom over upload_max_filesize.
;
; NOTE: this alone does not fix a 413 "Request Entity Too Large" coming
; back from nginx itself — that's nginx's client_max_body_size rejecting
; the request before it ever reaches PHP-FPM, and must be raised in the
; server's nginx site config (outside this repo). See CONTINUE.md.
upload_max_filesize = 20M
post_max_size = 40M
max_execution_time = 120
memory_limit = 256M
